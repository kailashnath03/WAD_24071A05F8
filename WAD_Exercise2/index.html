<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Digital Wallet</title>

<style>
body{
    font-family: Arial;
    background-color:#f2f2f2;
}

.container{
    width:400px;
    margin:auto;
    margin-top:80px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
    color:#333;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:green;
    color:white;
    border:none;
    font-size:16px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:gray;
}
</style>

</head>
<body>

<div class="container">

<h2>Digital Wallet Transaction</h2>

<form action="wallet" method="post">

<label>Enter Name</label>
<input type="text" name="username" required>

<label>Enter Amount</label>
<input type="number" name="amount" required>

<button type="submit">Send Money</button>

</form>

<div class="footer">
Copyright © 24071A05F8. All rights reserved.
</div>

</div>

</body>
</html>
